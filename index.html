<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Forge — Latin Roots</title>
<meta name="theme-color" content="#2C4BE0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Forge">
<style>
/* Fonts are self-hosted so the game works with no network at all. Both
   families are variable fonts, so one file covers every weight used. */
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:600 800;font-display:swap;src:url(fonts/baloo2.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600 900;font-display:swap;src:url(fonts/nunito.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --sky:#2C4BE0;          /* electric royal blue */
  --sky-deep:#1B2FA0;
  --card:#203BC0;
  --ink:#17246E;          /* tile ink */
  --white:#FFFFFF;
  --cloud:#DDE4FF;        /* dim text on blue */
  --sun:#FFC93C;          /* sunshine — buttons & prefix */
  --sun-hot:#FFB300;
  --mint:#4ADE80;         /* correct & suffix */
  --coral:#FF6B6B;        /* wrong */
  --grape:#B9A6FF;        /* suffix tint */
  --shadow:0 5px 0 rgba(10,18,70,.55);
  --pop:0 5px 0 rgba(10,18,70,.55), 0 12px 24px rgba(10,18,70,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(170deg,var(--sky) 0%,var(--sky-deep) 100%);
  background-attachment:fixed;
  color:var(--white);
  font-family:'Nunito',system-ui,sans-serif;font-weight:700;
  min-height:100vh;
}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(32px,6vw,48px);letter-spacing:.5px;
   text-shadow:0 4px 0 rgba(10,18,70,.5)}
h1 .dot{color:var(--sun)}
.tagline{color:var(--cloud);font-size:14px;font-weight:800;background:rgba(255,255,255,.1);padding:8px 16px;border-radius:999px}
nav{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
nav button{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;
  background:rgba(255,255,255,.12);color:var(--white);border:none;
  border-radius:16px;padding:10px 20px;cursor:pointer;transition:transform .12s,background .12s;
  box-shadow:0 4px 0 rgba(10,18,70,.4);
}
nav button:hover{transform:translateY(-2px);background:rgba(255,255,255,.22)}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(10,18,70,.4)}
nav button.active{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-hot),0 8px 18px rgba(255,201,60,.35)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.scorebar{display:flex;gap:12px;align-items:center;margin-bottom:18px;font-size:14px;color:var(--cloud);flex-wrap:wrap}
.scorebar>span{background:rgba(255,255,255,.12);border-radius:999px;padding:7px 16px;font-weight:800;display:flex;align-items:center;gap:6px}
.scorebar b{color:var(--sun);font-size:19px;font-family:'Baloo 2'}
.progress{flex:1;min-width:120px;height:14px;background:rgba(10,18,70,.4);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.progress i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--sun),var(--sun-hot));
  box-shadow:0 0 12px rgba(255,201,60,.7);width:0%;transition:width .35s cubic-bezier(.5,1.6,.4,1)}
.card{background:var(--card);border-radius:26px;padding:28px 22px;margin-bottom:18px;
  box-shadow:0 8px 0 rgba(10,18,70,.45), 0 18px 40px rgba(10,18,70,.35);
  border:3px solid rgba(255,255,255,.08)}
.prompt-label{font-family:'Baloo 2';font-size:15px;letter-spacing:.5px;color:var(--sun);margin-bottom:10px}
.bigword{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,7vw,56px);text-align:center;margin:10px 0 6px;letter-spacing:1px}
.bigword .hl{color:var(--sun);border-bottom:5px solid var(--sun);border-radius:2px;padding-bottom:2px}
.subtext{text-align:center;color:var(--cloud);font-size:16px;margin-bottom:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.choice{
  background:var(--white);color:var(--ink);border:none;
  border-radius:16px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;text-align:left;
  font-family:'Nunito';box-shadow:var(--shadow);transition:transform .12s;
}
.choice:hover{transform:translateY(-3px) rotate(-.5deg)}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(10,18,70,.55)}
.choice.correct{background:var(--mint);color:#0B3D22;animation:snapin .4s cubic-bezier(.5,1.8,.4,1)}
.choice.incorrect{background:var(--coral);color:#4A0F0F;animation:wobble .5s}
.choice:disabled{cursor:default}
@keyframes snapin{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* ---------- snap-block building tray (signature) ---------- */
.stick{
  display:flex;gap:6px;justify-content:center;align-items:stretch;margin:22px 0 8px;flex-wrap:wrap;
  padding:20px 16px;border-radius:20px;background:rgba(10,18,70,.35);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.35);
}
.slot{
  min-width:118px;min-height:74px;border:3px dashed rgba(255,255,255,.4);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 12px;
  transition:transform .15s;
}
.slot .slabel{font-family:'Baloo 2';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cloud)}
.slot.filled{border-style:solid;border-color:transparent;animation:snapin .35s cubic-bezier(.5,1.8,.4,1)}
.slot.filled .sval{cursor:pointer}
#slot-prefix.filled{background:var(--sun);color:var(--ink)}
#slot-stem.filled{background:var(--white);color:var(--ink)}
#slot-suffix.filled{background:var(--grape);color:var(--ink)}
.slot.filled .slabel{color:rgba(23,36,110,.6)}
.slot .sval{font-family:'Baloo 2';font-weight:800;font-size:26px}
/* tiles: chunky snap-blocks, color-coded by part */
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.tile{
  border:none;border-radius:14px;
  font-family:'Baloo 2';font-weight:800;font-size:22px;padding:12px 18px 10px;cursor:pointer;
  box-shadow:var(--pop);transition:transform .12s;position:relative;color:var(--ink);
}
.tile::after{ /* snap-stud on top, like a building block */
  content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:26px;height:10px;border-radius:6px 6px 0 0;background:inherit;filter:brightness(.92);
}
.tile-prefix{background:var(--sun)}
.tile-stem{background:var(--white)}
.tile-suffix{background:var(--grape)}
.tile small{display:block;font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:rgba(23,36,110,.65);margin-top:2px}
.tile:hover{transform:translateY(-4px) rotate(-1deg) scale(1.04)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(10,18,70,.55)}
.tile.used{opacity:.25;pointer-events:none}
.actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{font-family:'Baloo 2';font-weight:700;font-size:17px;border-radius:16px;padding:12px 28px;cursor:pointer;border:none;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-hot)}
.btn-primary:active{box-shadow:0 1px 0 var(--sun-hot)}
.btn-ghost{background:rgba(255,255,255,.12);color:var(--white);box-shadow:0 4px 0 rgba(10,18,70,.4)}
.btn-ghost:active{box-shadow:0 1px 0 rgba(10,18,70,.4)}
.feedback{text-align:center;margin-top:16px;font-size:17px;min-height:56px;font-weight:800}
.feedback .lit{color:var(--sun);font-family:'Baloo 2';font-size:20px}
.feedback.good{color:var(--mint)} .feedback.bad{color:#FFB3B3}
.feedback .expl{color:var(--cloud);font-size:14.5px;margin-top:4px;display:block;font-weight:700}
/* lexicon */
.lex-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lex-tabs button{background:rgba(255,255,255,.12);border:none;color:var(--white);border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:'Baloo 2';font-weight:700;box-shadow:0 3px 0 rgba(10,18,70,.4);transition:transform .12s}
.lex-tabs button:hover{transform:translateY(-2px)}
.lex-tabs button.active{background:var(--white);color:var(--ink);box-shadow:0 3px 0 rgba(10,18,70,.55)}
.lex-search{width:100%;padding:13px 18px;border-radius:14px;border:none;background:rgba(10,18,70,.35);color:var(--white);font-size:16px;margin-bottom:14px;font-family:'Nunito';font-weight:700;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.lex-search::placeholder{color:var(--cloud)}
.lex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lex-item{background:rgba(255,255,255,.1);border-radius:16px;padding:15px;border:2px solid rgba(255,255,255,.08)}
.lex-item .part{font-family:'Baloo 2';font-weight:800;font-size:24px;color:var(--sun)}
.lex-item .mean{font-size:14.5px;margin:3px 0}
.lex-item .ex{font-size:12.5px;color:var(--cloud)}
.done-card{text-align:center;padding:44px 20px}
.done-card .score-big{font-family:'Baloo 2';font-weight:800;font-size:76px;color:var(--sun);text-shadow:0 5px 0 rgba(10,18,70,.5);animation:snapin .5s cubic-bezier(.5,1.8,.4,1)}
/* sparkles */
#sparkle-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.spark{position:absolute;font-size:20px;animation:sparkfly .9s ease-out forwards}
@keyframes sparkfly{
  0%{transform:translate(0,0) scale(.6) rotate(0deg);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--rot));opacity:0}
}
/* flashcards */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.fc-count{color:var(--cloud);font-size:14px;font-weight:800}
.flashcard{width:min(430px,90vw);height:270px;perspective:1200px;cursor:pointer;background:none;border:none;padding:0}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;box-shadow:var(--pop)}
.fc-front{background:var(--white);color:var(--ink)}
.fc-front .fc-part{font-family:'Baloo 2';font-weight:800;font-size:54px}
.fc-front .fc-type{font-family:'Baloo 2';font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#6B5310;background:var(--sun);padding:4px 14px;border-radius:999px}
.fc-hint{font-size:13px;color:#9AA3C9;position:absolute;bottom:16px;font-weight:800}
.fc-back{background:var(--sky-deep);border:4px solid var(--sun);color:var(--white);transform:rotateY(180deg)}
.fc-back .fc-part{font-family:'Baloo 2';font-weight:800;font-size:28px;color:var(--sun)}
.fc-back .fc-mean{font-size:20px;text-align:center;font-weight:800}
.fc-back .fc-ex{font-size:14.5px;color:var(--cloud)}
.fc-back .fc-def{font-size:14.5px;color:var(--white);text-align:center;max-width:350px}
.fc-back .fc-lit{font-size:13.5px;color:var(--cloud);font-style:italic}
.fc-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* story modal */
.story-overlay{position:fixed;inset:0;background:rgba(10,16,60,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.story-card{background:var(--white);color:var(--ink);border-radius:26px;max-width:480px;width:100%;padding:30px 26px;box-shadow:0 10px 0 rgba(10,18,70,.5),0 30px 60px rgba(0,0,0,.5);animation:snapin .45s cubic-bezier(.5,1.8,.4,1);text-align:center}
.story-card .story-badge{font-family:'Baloo 2';font-size:13px;letter-spacing:2px;text-transform:uppercase;background:var(--sun);color:#6B5310;display:inline-block;padding:5px 16px;border-radius:999px;margin-bottom:10px}
.story-card .story-emoji{font-size:44px;margin:4px 0}
.story-card h3{font-family:'Baloo 2';font-weight:800;font-size:24px;margin-bottom:10px}
.story-card p{font-size:15.5px;font-weight:700;line-height:1.55;color:#2A3670;text-align:left}
.story-card .btn{margin-top:18px}
/* stories collection */
.story-item{background:rgba(255,255,255,.1);border-radius:16px;padding:16px;border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .12s}
.story-item:hover{transform:translateY(-2px)}
.story-item.locked{opacity:.45;cursor:default}
.story-item .st-title{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--sun)}
.story-item .st-tease{font-size:13px;color:var(--cloud);margin-top:3px}
/* prefix family expander in lexicon */
.lex-item.expandable{cursor:pointer;transition:transform .12s}
.lex-item.expandable:hover{transform:translateY(-2px);border-color:var(--sun)}
.family-panel{grid-column:1/-1;background:rgba(10,18,70,.35);border-radius:18px;padding:20px;border:2px solid var(--sun)}
.family-panel h3{font-family:'Baloo 2';font-size:22px;color:var(--sun);margin-bottom:6px}
.family-panel .fam-story{font-size:14.5px;line-height:1.55;color:var(--white);margin-bottom:12px}
.family-chips{display:flex;flex-wrap:wrap;gap:8px}
.family-chips span{background:var(--white);color:var(--ink);border-radius:999px;padding:6px 14px;font-family:'Baloo 2';font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(10,18,70,.5)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word Forge<span class="dot">.</span></h1>
    <div class="tagline">🧩 Snap Latin parts together. Unlock big words!</div>
  </header>

  <nav>
    <button id="tab-forge" class="active" onclick="setMode('forge')">🔨 Forge</button>
    <button id="tab-decode" onclick="setMode('decode')">🔍 Decode</button>
    <button id="tab-lexicon" onclick="setMode('lexicon')">📚 Lexicon</button>
    <button id="tab-cards" onclick="setMode('cards')">⚡ Flashcards</button>
    <button id="tab-stories" onclick="setMode('stories')">📖 Stories <span id="story-count"></span></button>
  </nav>

  <div class="scorebar" id="scorebar">
    <span>⭐ <b id="score">0</b></span>
    <span>🔥 <b id="streak">0</b></span>
    <div class="progress"><i id="prog"></i></div>
    <span id="roundlabel">1 / 10</span>
  </div>

  <div id="stage"></div>
<div id="sparkle-layer"></div>
</div>

<script>
/* ============ DATA ============ */
const PREFIXES = [

let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(freq,start,dur,type="sine",vol=0.18){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);
  g.gain.setValueAtTime(0,c.currentTime+start);
  g.gain.linearRampToValueAtTime(vol,c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+start+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+start);o.stop(c.currentTime+start+dur+0.05);
}
function sndFlip(){ // quick whoosh: pitch sweep
  const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type="triangle";
  o.frequency.setValueAtTime(280,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(720,c.currentTime+0.16);
  g.gain.setValueAtTime(0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.2);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.25);
}
function sndCorrect(){ // bright major arpeggio
  tone(523.25,0,   .25,"sine",.16);
  tone(659.25,.09, .25,"sine",.16);
  tone(783.99,.18, .3, "sine",.16);
  tone(1046.5,.27, .4, "sine",.14);
}
function sndWrong(){ // warm, gentle "try again" — soft rising two-note nudge
  tone(392,0,  .28,"sine",.12);
  tone(440,.2, .34,"sine",.12);
}
function sparkleBurst(x,y,n=26){
  const layer=$("sparkle-layer");
  const glyphs=["✦","✧","✨","★","·"];
  for(let i=0;i<n;i++){
    const sp=document.createElement("span");
    sp.className="spark";
    sp.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*140;
    sp.style.left=x+"px"; sp.style.top=y+"px";
    sp.style.color=Math.random()<.6?"var(--brass-soft)":"#FFFFFF";
    sp.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    sp.style.setProperty("--dy",(Math.sin(ang)*dist-40)+"px");
    sp.style.setProperty("--rot",(Math.random()*360-180)+"deg");
    layer.appendChild(sp);
    setTimeout(()=>sp.remove(),950);
  }
}
function celebrateAt(el){
  const r=el.getBoundingClientRect();
  sparkleBurst(r.left+r.width/2, r.top+r.height/2);
}

let storiesUnlocked=0, correctTotal=0;
/* Saved progress. Only the cumulative unlock state belongs here: score,
   streak and round are reset by setMode on purpose. Every access is
   guarded, since localStorage throws outright in some privacy modes. */
const PROGRESS_KEY="wordforge:progress";
function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify({storiesUnlocked, correctTotal})); }catch(e){}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(PROGRESS_KEY); if(!raw) return;
    const saved=JSON.parse(raw);
    storiesUnlocked=Math.max(0, Math.min(STORIES.length, saved.storiesUnlocked|0));
    correctTotal=Math.max(0, saved.correctTotal|0);
  }catch(e){}
}
function updateStoryCount(){ $("story-count").textContent = storiesUnlocked?("("+storiesUnlocked+")"):""; }
function maybeUnlockStory(){
  correctTotal++;
  if(correctTotal%3===0 && storiesUnlocked<STORIES.length){
    storiesUnlocked++;
    updateStoryCount();
    setTimeout(()=>showStoryModal(storiesUnlocked-1,true),900);
  }
  saveProgress();
}
function showStoryModal(i,isNew){
  const st=STORIES[i];
  const ov=document.createElement("div");
  ov.className="story-overlay";
  ov.innerHTML=`<div class="story-card">
    <div class="story-badge">${isNew?"\u{1F513} New story unlocked!":"\u{1F4D6} Story time"}</div>
    <div class="story-emoji">${st[0]}</div>
    <h3>${st[1]}</h3>
    <p>${st[2]}</p>
    <button class="btn btn-primary" onclick="this.closest('.story-overlay').remove()">Awesome! Keep playing \u{1F680}</button>
  </div>`;
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
  if(isNew){ sndCorrect(); const r=ov.querySelector(".story-card").getBoundingClientRect(); setTimeout(()=>sparkleBurst(window.innerWidth/2,window.innerHeight/3,20),150); }
}
function renderStories(){
  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">\u{1F4D6} Story Time \u00b7 Unlock a new word-history story every 3 correct answers!</div>
      <div class="lex-grid">${STORIES.map((st,i)=> i<storiesUnlocked
        ? `<div class="story-item" onclick="showStoryModal(${i},false)"><div class="st-title">${st[0]} ${st[1]}</div><div class="st-tease">Tap to read again</div></div>`
        : `<div class="story-item locked"><div class="st-title">\u{1F512} Story #${i+1}</div><div class="st-tease">Get ${(i+1)*3 - correctTotal>0?(i+1)*3 - correctTotal:3} more correct answers to unlock</div></div>`
      ).join("")}</div>
    </div>`;
}

incredible:"\u{1F92F} Incredible = \u201cnot believable\u201d \u2014 so amazing your brain refuses to believe it!"
};
function ahaLine(word){
  const f=AHA[word];
  return f?`<span class="expl" style="color:var(--sun);font-weight:800">\u{1F4A1} Aha! ${f}</span>`:"";
}

/* ============ STATE ============ */
let mode="forge", score=0, streak=0, round=0, ROUNDS=10;
let current=null, answered=false, forgePicks={};

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const meaningOf=(list,key)=>{const f=list.find(x=>x[0]===key);return f?f[1]:"";};

function setMode(m){
  mode=m; round=0; score=0; streak=0;
  ["forge","decode","lexicon","cards","stories"].forEach(t=>$("tab-"+t).classList.toggle("active",t===m));
  $("scorebar").style.display = (m==="lexicon"||m==="cards"||m==="stories") ? "none":"flex";
  updateBar();
  if(m==="lexicon") renderLexicon(); else if(m==="cards") renderCards(); else if(m==="stories") renderStories(); else nextRound();
}
function updateBar(){
  $("score").textContent=score; $("streak").textContent=streak;
  $("prog").style.width=(round/ROUNDS*100)+"%";
  $("roundlabel").textContent=Math.min(round+1,ROUNDS)+" / "+ROUNDS;
}
function nextRound(){
  if(round>=ROUNDS){renderDone();return;}
  answered=false;
  if(mode==="decode") renderDecode(); else renderForge();
  updateBar();
}
function markResult(ok){
  answered=true;
  if(ok){score+=10+Math.min(streak,5)*2; streak++;} else streak=0;
  round++;
}

/* ============ DECODE MODE ============ */
function renderDecode(){
  const w=pick(WORDS);
  // choose which part to quiz: prefix, stem, or suffix (if present)
  const parts=[["prefix",w[1],PREFIXES],["stem",w[2],STEMS],["suffix",w[3],SUFFIXES]].filter(p=>p[1]);
  const [ptype,pkey,plist]=pick(parts);
  const correct=meaningOf(plist,pkey);
  const wrongs=shuffle(plist.filter(x=>x[0]!==pkey&&x[1]!==correct)).slice(0,3).map(x=>x[1]);
  const opts=shuffle([correct,...wrongs]);
  current={w,ptype,pkey,correct};

  // build highlighted word display
  const clean=s=>s?s.replace(/-/g,""):"";
  const pre=clean(w[1]), stem=w[2], suf=clean(w[3]);
  const word=w[0];
  // find spans: approximate by matching the quizzed part inside the word
  const target = ptype==="prefix"?pre : ptype==="suffix"?suf : stem;
  let html=word;
  const idx = ptype==="prefix" ? 0 : ptype==="suffix" ? word.length-suf.length : word.indexOf(stem);
  if(idx>=0 && target && word.slice(idx,idx+target.length)===target){
    html = word.slice(0,idx)+'<span class="hl">'+target+'</span>'+word.slice(idx+target.length);
  } else {
    html = word+' <span class="hl">('+pkey+')</span>';
  }

  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">🔍 Decode · What does the highlighted ${ptype} mean?</div>
      <div class="bigword">${html}</div>
      <div class="subtext">"${w[0]}" — ${w[5]}</div>
      <div class="choices">${opts.map(o=>`<button class="choice" onclick="answerDecode(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>
      <div class="actions"><button class="btn btn-ghost" id="nextbtn" style="display:none" onclick="nextRound()">Next word 👉</button></div>
    </div>`;
}
function answerDecode(btn,val){
  if(answered)return;
  const ok = val===current.correct;
  markResult(ok);
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.textContent===current.correct)b.classList.add("correct");
  });
  if(!ok)btn.classList.add("incorrect");
  if(ok){sndCorrect();celebrateAt(btn);maybeUnlockStory();}else{sndWrong();}
  const w=current.w;
  const lit=`<span class="lit">${w[0]}</span> = ${[w[1],w[2],w[3]].filter(Boolean).join(" + ")} — literally "${w[4]}"`;
  $("fb").className="feedback "+(ok?"good":"bad");
  $("fb").innerHTML=(ok?"🎉 Nailed it! ":"💪 So close — check the answer! ")+`<span class="expl">${lit}</span>`+ahaLine(w[0]);
  $("nextbtn").style.display="inline-block";
  updateBar();
}

/* ============ FORGE MODE ============ */
function renderForge(){
  const w=pick(WORDS);
  current={w};
  forgePicks={prefix:null,stem:null,suffix:null};
  const needSuffix=!!w[3], needPrefix=!!w[1];

  const bankTiles=[];
  if(needPrefix){
    bankTiles.push({t:"prefix",v:w[1]});
    shuffle(PREFIXES.filter(p=>p[0]!==w[1])).slice(0,2).forEach(p=>bankTiles.push({t:"prefix",v:p[0]}));
  }
  bankTiles.push({t:"stem",v:w[2]});
  shuffle(STEMS.filter(s=>s[0]!==w[2])).slice(0,2).forEach(s=>bankTiles.push({t:"stem",v:s[0]}));
  if(needSuffix){
    bankTiles.push({t:"suffix",v:w[3]});
    shuffle(SUFFIXES.filter(s=>s[0]!==w[3])).slice(0,2).forEach(s=>bankTiles.push({t:"suffix",v:s[0]}));
  }
  current.bank=shuffle(bankTiles);
  current.needSuffix=needSuffix; current.needPrefix=needPrefix;

  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">🔨 Forge · Build the word that means…</div>
      <div class="bigword" style="font-size:clamp(22px,4vw,30px)">"${w[5]}"</div>
      <div class="subtext">Literal Latin sense: <em>${w[4]}</em></div>
      <div class="stick" id="stick">
        ${needPrefix?'<div class="slot" id="slot-prefix"><span class="slabel">prefix</span><span class="sval">&nbsp;</span></div>':""}
        <div class="slot" id="slot-stem"><span class="slabel">stem</span><span class="sval">&nbsp;</span></div>
        ${needSuffix?'<div class="slot" id="slot-suffix"><span class="slabel">suffix</span><span class="sval">&nbsp;</span></div>':""}
      </div>
      <div class="bank" id="bank"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="checkForge()">Snap it together!</button>
        <button class="btn btn-ghost" onclick="clearForge()">Clear</button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="actions"><button class="btn btn-ghost" id="nextbtn" style="display:none" onclick="nextRound()">Next word 👉</button></div>
    </div>`;
  renderBank();
}
function renderBank(){
  const lists={prefix:PREFIXES,stem:STEMS,suffix:SUFFIXES};
  $("bank").innerHTML=current.bank.map((tile,i)=>{
    const used=forgePicks[tile.t]===tile.v;
    return `<button class="tile tile-${tile.t} ${used?"used":""}" onclick="pickTile(${i})">${tile.v}<small>${meaningOf(lists[tile.t],tile.v)}</small></button>`;
  }).join("");
  ["prefix","stem","suffix"].forEach(t=>{
    const slot=$("slot-"+t); if(!slot)return;
    const v=forgePicks[t];
    slot.classList.toggle("filled",!!v);
    slot.querySelector(".sval").innerHTML=v||"&nbsp;";
    slot.onclick=v?()=>{if(!answered){forgePicks[t]=null;renderBank();}}:null;
  });
}
function pickTile(i){
  if(answered)return;
  const tile=current.bank[i];
  forgePicks[tile.t]=tile.v;
  renderBank();
}
function clearForge(){ if(answered)return; forgePicks={prefix:null,stem:null,suffix:null}; renderBank(); }
function checkForge(){
  if(answered)return;
  const w=current.w;
  if((current.needPrefix&&!forgePicks.prefix)||!forgePicks.stem||(current.needSuffix&&!forgePicks.suffix)){
    $("fb").className="feedback"; $("fb").textContent="Snap a block into every empty slot first!";
    return;
  }
  const ok = (!current.needPrefix||forgePicks.prefix===w[1])&&forgePicks.stem===w[2]&&(!current.needSuffix||forgePicks.suffix===w[3]);
  markResult(ok);
  if(ok){sndCorrect();celebrateAt($("stick"));maybeUnlockStory();}else{sndWrong();}
  $("fb").className="feedback "+(ok?"good":"bad");
  $("fb").innerHTML=(ok?"🎉 SNAP! You built it! ":"💪 Good try! Peek at the answer — you\u2019ll crush it next time. ")+
    `<span class="expl"><span class="lit">${w[0]}</span> = ${[w[1],w[2],w[3]].filter(Boolean).join(" + ")} — literally "${w[4]}"</span>`+ahaLine(w[0]);
  $("nextbtn").style.display="inline-block";
  updateBar();
}

/* ============ LEXICON ============ */
let lexTab="prefix";
function renderLexicon(){
  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">📚 Lexicon · Every word part in the game</div>
      <div class="lex-tabs">
        <button id="lt-prefix" onclick="setLexTab('prefix')">Prefixes (${PREFIXES.length})</button>
        <button id="lt-stem" onclick="setLexTab('stem')">Stems (${STEMS.length})</button>
        <button id="lt-suffix" onclick="setLexTab('suffix')">Suffixes (${SUFFIXES.length})</button>
      </div>
      <input class="lex-search" id="lexsearch" placeholder="Search a part, meaning, or example…" oninput="renderLexGrid()">
      <div class="lex-grid" id="lexgrid"></div>
    </div>`;
  setLexTab(lexTab);
}
function setLexTab(t){
  lexTab=t;
  ["prefix","stem","suffix"].forEach(x=>$("lt-"+x).classList.toggle("active",x===t));
  renderLexGrid();
}
function renderLexGrid(){
  const list={prefix:PREFIXES,stem:STEMS,suffix:SUFFIXES}[lexTab];
  const q=($("lexsearch").value||"").toLowerCase();
  let html=list
    .filter(x=>!q||x.join(" ").toLowerCase().includes(q))
    .map(x=>{
      const hasFam = lexTab==="prefix" && FAMILY_NOTES[x[0]];
      const open = hasFam && openFamily===x[0];
      let item=`<div class="lex-item ${hasFam?"expandable":""}" ${hasFam?`onclick="toggleFamily('${x[0]}')"`:""}>
        <div class="part">${x[0]} ${hasFam?(open?"\u25B4":"\u25BE"):""}</div>
        <div class="mean">${x[1]}</div><div class="ex">as in <em>${x[2]}</em>${hasFam?" \u00b7 <b>tap for the family story!</b>":""}</div></div>`;
      if(open){
        item+=`<div class="family-panel"><h3>The ${x[0]} family</h3>
          <div class="fam-story">${FAMILY_NOTES[x[0]]}</div>
          <div class="family-chips">${familyWords(x[0]).map(w=>"<span>"+w+"</span>").join("")}</div></div>`;
      }
      return item;
    })
    .join("")||'<div style="color:var(--cloud)">No parts match that search.</div>';
  $("lexgrid").innerHTML=html;
}

/* ============ FLASHCARDS ============ */
let fcTab="all", fcDeck=[], fcIdx=0, fcFlipped=false;
function renderCards(){
  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">⚡ Flashcards · Tap a card to flip it!</div>
      <div class="lex-tabs">
        <button id="fct-all" onclick="setFcTab('all')">All (${PREFIXES.length+STEMS.length+SUFFIXES.length})</button>
        <button id="fct-prefix" onclick="setFcTab('prefix')">Prefixes (${PREFIXES.length})</button>
        <button id="fct-stem" onclick="setFcTab('stem')">Stems (${STEMS.length})</button>
        <button id="fct-suffix" onclick="setFcTab('suffix')">Suffixes (${SUFFIXES.length})</button>
        <button id="fct-words" onclick="setFcTab('words')">Words (${WORDS.length})</button>
      </div>
      <div class="fc-stage">
        <button class="flashcard" id="fcard" onclick="flipCard()" aria-label="Flip flashcard">
          <div class="fc-inner">
            <div class="fc-face fc-front">
              <div class="fc-type" id="fc-type"></div>
              <div class="fc-part" id="fc-front-part"></div>
              <div class="fc-hint">👆 tap to flip!</div>
            </div>
            <div class="fc-face fc-back">
              <div class="fc-part" id="fc-back-part"></div>
              <div class="fc-mean" id="fc-mean"></div>
              <div class="fc-ex" id="fc-ex"></div>
            </div>
          </div>
        </button>
        <div class="fc-count" id="fc-count"></div>
        <div class="fc-nav">
          <button class="btn btn-ghost" onclick="fcMove(-1)">← Previous</button>
          <button class="btn btn-primary" onclick="fcMove(1)">Next →</button>
          <button class="btn btn-ghost" onclick="fcShuffle()">Shuffle</button>
        </div>
      </div>
    </div>`;
  setFcTab(fcTab);
}
function fcList(){
  if(fcTab==="prefix")return PREFIXES.map(x=>["prefix",...x]);
  if(fcTab==="stem")return STEMS.map(x=>["stem",...x]);
  if(fcTab==="suffix")return SUFFIXES.map(x=>["suffix",...x]);
  if(fcTab==="words")return WORDS.map(w=>["word",...w]);
  return [...PREFIXES.map(x=>["prefix",...x]),...STEMS.map(x=>["stem",...x]),...SUFFIXES.map(x=>["suffix",...x]) ];
}
function setFcTab(t){
  fcTab=t;
  ["all","prefix","stem","suffix","words"].forEach(x=>$("fct-"+x).classList.toggle("active",x===t));
  fcDeck=shuffle(fcList()); fcIdx=0; fcFlipped=false;
  showCard();
}
function showCard(){
  const c=fcDeck[fcIdx];
  $("fcard").classList.toggle("flipped",fcFlipped);
  if(c[0]==="word"){
    // c = ["word", word, prefix, stem, suffix, literal, definition]
    const parts=[c[2],c[3],c[4]].filter(Boolean).join(" + ");
    $("fc-type").textContent="word";
    $("fc-front-part").textContent=c[1];
    $("fc-front-part").style.fontSize=c[1].length>12?"34px":"44px";
    $("fc-back-part").textContent=parts;
    $("fc-mean").innerHTML='<span class="fc-lit">literally \u201c'+c[5]+'\u201d</span>';
    $("fc-ex").innerHTML='<span class="fc-def">'+c[6]+'</span>';
    $("fc-count").textContent=(fcIdx+1)+" of "+fcDeck.length+" \u00b7 words";
  }else{
    $("fc-type").textContent=c[0];
    $("fc-front-part").textContent=c[1];
    $("fc-front-part").style.fontSize="";
    $("fc-back-part").textContent=c[1];
    $("fc-mean").textContent=c[2];
    $("fc-ex").innerHTML="as in <em>"+c[3]+"</em>";
    $("fc-count").textContent=(fcIdx+1)+" of "+fcDeck.length+" \u00b7 "+(fcTab==="all"?"all parts":fcTab+"s");
  }
}
function flipCard(){ fcFlipped=!fcFlipped; sndFlip(); $("fcard").classList.toggle("flipped",fcFlipped); }
function fcMove(d){
  fcFlipped=false;
  fcIdx=(fcIdx+d+fcDeck.length)%fcDeck.length;
  showCard();
}
function fcShuffle(){ fcDeck=shuffle(fcDeck); fcIdx=0; fcFlipped=false; showCard(); }

/* ============ PREFIX FAMILY JOURNEYS ============ */
const FAMILY_NOTES={
"ad-":"The \u201cad- family\u201d is all about moving TOWARD things. Ancient speakers turned physical motion into ideas: accurate means \u201crun to\u201d (hit the target!), attract means \u201cpull to,\u201d assist means \u201cstand to\u201d (standing beside a friend in battle), and attention means \u201chold to\u201d \u2014 your mind literally holding onto something. Ad- shape-shifts to match the next letter: ac-, af-, ap-, as-, at-!",
"con-":"The \u201ccon- family\u201d is about doing things TOGETHER. Comfort = \u201cstrong with\u201d (lending someone your strength), command = \u201chand with\u201d (taking things in hand), confuse = \u201cpour together\u201d (a murky mixed-up drink), and conclude = \u201cclose with\u201d (shutting the box). Con- disguises itself as com-, col-, cor-, and co-.",
"de-":"The \u201cde- family\u201d points DOWN and AWAY. Depend = \u201chang down from\u201d (like dangling from a rope you trust!), describe = \u201cwrite down,\u201d and depart = \u201cshare away\u201d \u2014 splitting off from the group. When you see de-, picture something dropping or leaving.",
"ex-":"The \u201cex- family\u201d bursts OUT. Emotion = \u201cmoving out\u201d (feelings escaping your body), exclaim = \u201cshout out,\u201d extract = \u201cpull out\u201d (like a dentist!), and extortion = \u201ctwist out.\u201d Ex- sometimes shrinks to just e- (eject, emerge) or ef- (effect).",
"in-":"The sneaky \u201cin- family\u201d has TWO jobs: going INTO (inject = throw in, inspire = breathe in) and saying NOT (invisible = not seeable, incredible = not believable). It also shape-shifts: im-, il-, ir-. You have to read the whole word to know which in- you\u2019ve met!",
"pro-":"The \u201cpro- family\u201d charges FORWARD. Propel = \u201cdrive forward,\u201d project = \u201cthrow forward,\u201d promote = \u201cmove forward,\u201d and produce = \u201clead forward.\u201d Pro- words are the go-getters of English \u2014 always pushing ahead!",
"re-":"The mighty \u201cre- family\u201d goes BACK and AGAIN \u2014 it\u2019s the most-used prefix in English! Reject = \u201cthrow back,\u201d record = \u201cheart back\u201d (returning something to your heart to remember it!), reflect = \u201cbend back\u201d (like light off a mirror), and revolve = \u201croll back around.\u201d",
"sub-":"The \u201csub- family\u201d lives UNDER everything. Submit = \u201csend under\u201d (placing yourself beneath someone\u2019s authority), submerge = \u201cplunge under,\u201d support = \u201ccarry from under\u201d (holding something up!). It disguises itself as sup-, sus-, suc-, suf-.",
"trans-":"The \u201ctrans- family\u201d crosses OVER. Transport = \u201ccarry across,\u201d transmit = \u201csend across,\u201d translucent = \u201clight shining across/through.\u201d Trans- words are bridges \u2014 they always take something from one side to the other.",
"post-":"The \u201cpost- family\u201d comes AFTER. Postpone = \u201cplace after\u201d \u2014 ancient people pictured time as a road, and delaying meant setting a task farther down the path. A postscript (P.S.!) is \u201cwritten after\u201d the letter ends.",
"pre-":"The \u201cpre- family\u201d comes BEFORE. Predict = \u201csay before,\u201d prevent = \u201ccome before\u201d (getting there first to stop something!), and president = \u201cthe one who sits before\u201d the assembly. Pre- words are the early birds.",
"inter-":"The \u201cinter- family\u201d lives BETWEEN. Interrupt = \u201cbreak between\u201d (smashing into the middle of a sentence!), intersect = \u201ccut between,\u201d and an interlude = \u201ca play between\u201d acts. Inter- is the in-betweener."
};
let openFamily=null;
function toggleFamily(prefix){
  openFamily = openFamily===prefix ? null : prefix;
  renderLexGrid();
}
function familyWords(prefix){
  return WORDS.filter(w=>w[1]===prefix).map(w=>w[0]).slice(0,14);
}

/* ============ DONE ============ */
function renderDone(){
  const msg = score>=120?"🏆 WORD WIZARD! You\u2019re unstoppable!":score>=80?"🌟 Word Builder — awesome run!":"🚀 Great practice! Every round makes you stronger.";
  $("stage").innerHTML=`
    <div class="card done-card">
      <div class="prompt-label">You did it!</div>
      <div class="score-big">${score}</div>
      <div class="subtext">${msg}</div>
      <div class="actions">
        <button class="btn btn-primary" onclick="setMode('${mode}')">Play again</button>
        <button class="btn btn-ghost" onclick="setMode('${mode==="forge"?"decode":"forge"}')">Try ${mode==="forge"?"Decode":"Forge"}</button>
      </div>
    </div>`;
}

loadProgress();
updateStoryCount();
setMode("forge");

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    try{ navigator.serviceWorker.register("sw.js"); }catch(e){}
  });
}
